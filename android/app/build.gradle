plugins {
    id 'com.android.application'
}

android {
    namespace 'com.benmoga.inventario'
    compileSdk 34

    defaultConfig {
        applicationId "com.benmoga.inventario"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Solo la biblioteca oficial de deslizar‑para‑recargar (SwipeRefreshLayout).
// El resto son APIs del propio Android.
dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
